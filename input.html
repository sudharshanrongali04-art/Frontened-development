<html>
    <title>
        INPUT PAGE
    </title>
    <head>
        <h2>Registration Form</h2>
    </head>
    <body>
        <form>
            <label for="fname">First name:</label><br>  
            &nbsp;<input type="text" id="fname" name="fname"><br>  
            <label for="lname">Last name:</label><br>
            &nbsp;<input type="text" id="lname" name="lname"><br><br>
            <label for="email">Email:</label><br>
            &nbsp;<input type="email" id="email" name="email"><br><br>
            <label for="phone">Phone:</label><br>
            &nbsp;<input type="tel" id="phone" name="phone"><br><br>
            <p>Gender:</p>
            <input type="checkbox" id="male" name="gender" value="male">
            &nbsp;<label for="male">Male</label><br>
            <input type="checkbox" id="female" name="gender" value="female">
            &nbsp;<label for="female">Female</label><br>
            <input type="checkbox" id="others" name="gender" value="others">
            &nbsp;<label for="others">Others</label><br><br>
            <label for="password">Password:</label><br>
            &nbsp;<input type="password" id="password" name="password"><br>
            <label for="cpassword">Confirm Password:</label><br>
            &nbsp;<input type="password" id="cpassword" name="cpassword"><br><br>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input type="submit" value="Submit" onclick="alert('Do you want to Submit')">
            <input type="reset" value="Reset" onclick="alert('CAUTION:All the data will be lost')">
        </form>

    </body>
</html>
