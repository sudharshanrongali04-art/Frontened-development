<html>
    <head>
        <link rel="stylesheet" href="task-5.css">
        <script src="task-5.js" defer></script>
    </head>
    
    <body id="demo">
        <form>
            <h2>Create Account</h2>
            <label for="fname" id="fname">First Name</label><br>
            <input id="fname" type="text" name="fname" placeholder=" First Name"><br><br>
            <label for="lname">Last Name</label><br>
            <input id="lname" type="text" name="lname" placeholder=" Last Name"><br><br>
            <label for="email">Email Address</label><br>
            <input id="email" type="email" placeholder=" Email"><br><br>
            <label for="age" min="'18">Age</label><br>
            
            <input id="age" type="number" placeholder=" Age"><br><br>
            <label id="pass">Password</label><br>
            
            <input id="pass" type="password" placeholder="  Min 8 characters"><br><br>
            <label id="cpass">Confirm Password</label><br>
            <input id="cpass" type="password" placeholder=" Confirm Password"><br><br>
            <input id="submit" type="submit" value="SUBMIT" onclick="check()">
        </form>
        
    </body>
</html>
